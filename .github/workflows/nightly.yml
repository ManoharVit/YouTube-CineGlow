name: Nightly Chromium & QA Matrix

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install latest Chrome for Testing
        run: npx puppeteer browsers install chrome

      - name: Static lint & full test suite
        run: |
          npm run lint
          npm test
          npm run eval:hide-ai
          npm run check:size

      - name: Real-Chromium E2E smoke suite
        if: hashFiles('scripts/e2e-smoke.js') != ''
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Upload E2E failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-failure-screenshots
          path: test-results/e2e-failures
          if-no-files-found: ignore
