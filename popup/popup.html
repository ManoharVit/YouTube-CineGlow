<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>YouTube CineGlow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="../icons/icon-48.png" width="28" height="28" alt="">
      <h1>CineGlow</h1>
    </div>
    <div class="switches">
      <div class="switch-row">
        <span>Glow</span>
        <label class="switch" title="Enable ambient light">
          <input type="checkbox" id="enabled" aria-label="Enable ambient light">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
      <div class="switch-row">
        <span>AdBlock</span>
        <label class="switch" title="Enable ad blocker">
          <input type="checkbox" id="adblockEnabled" aria-label="Enable ad blocker">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
      <div class="switch-row">
        <span>Auto-HD</span>
        <label class="switch" title="Force video quality">
          <input type="checkbox" id="qualityEnabled" aria-label="Force video quality">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
    </div>
  </header>

  <div id="stats" class="stats">
    Ads blocked/skipped: <strong id="adblockCount">0</strong>
  </div>

  <main id="controls">
    <div class="control">
      <label for="preferredQuality">Preferred Quality</label>
      <select id="preferredQuality">
        <option value="highres">Max Available (8K/4K)</option>
        <option value="hd2160">4K (2160p)</option>
        <option value="hd1440">HD (1440p)</option>
        <option value="hd1080">HD (1080p)</option>
        <option value="hd720">HD (720p)</option>
      </select>
    </div>

    <!-- Codec Options -->
    <div class="control" style="border-top: 1px solid #333; padding-top: 10px; margin-top: 5px;">
      <label style="color: var(--text); font-weight: 500; margin-bottom: 8px;">Advanced Tweaks (Reload page after changing)</label>
      
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span style="color: var(--muted);">Block AV1 Codec</span>
        <label class="switch">
          <input type="checkbox" id="blockAV1">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>

      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span style="color: var(--muted);">Block VP9 Codec</span>
        <label class="switch">
          <input type="checkbox" id="blockVP9">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>

      <div style="display: flex; justify-content: space-between;">
        <span style="color: var(--muted);">Block 60fps video</span>
        <label class="switch">
          <input type="checkbox" id="block60fps">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>

      <div style="margin-top: 8px; font-size: 10px; color: #888; line-height: 1.3;">
        <em>Note: YouTube does not encode 4K/8K in H.264. Blocking both AV1 and VP9 will limit your maximum resolution to 1080p.</em>
      </div>
    </div>
    
    <div class="control" style="border-top: 1px solid #333; padding-top: 10px; margin-top: 5px;">
      <label for="opacity">Intensity <output for="opacity" data-unit="%"></output></label>
      <input type="range" id="opacity" min="0" max="100" step="1">
    </div>
    <div class="control">
      <label for="blur">Blur <output for="blur" data-unit="px"></output></label>
      <input type="range" id="blur" min="0" max="150" step="1">
    </div>
    <div class="control">
      <label for="spread">Spread <output for="spread" data-unit="%"></output></label>
      <input type="range" id="spread" min="100" max="500" step="1">
    </div>
    <div class="control">
      <label for="saturation">Saturation <output for="saturation" data-unit="%"></output></label>
      <input type="range" id="saturation" min="0" max="150" step="1">
    </div>
    <div class="control">
      <label for="brightness">Brightness <output for="brightness" data-unit="%"></output></label>
      <input type="range" id="brightness" min="20" max="200" step="1">
    </div>
    <div class="control">
      <label for="smoothness">Smoothness <output for="smoothness" data-unit="%"></output></label>
      <input type="range" id="smoothness" min="0" max="100" step="1">
    </div>
    <div class="control">
      <label for="fps">Frame rate</label>
      <select id="fps">
        <option value="15">15 fps (battery saver)</option>
        <option value="30">30 fps</option>
        <option value="60">60 fps (smoothest)</option>
      </select>
    </div>
  </main>

  <footer>
    <span class="hint">Works best with YouTube's dark theme.</span>
    <button type="button" id="reset">Reset</button>
  </footer>

  <script src="../shared/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
